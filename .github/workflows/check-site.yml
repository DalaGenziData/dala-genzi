name: check-site
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live website
        run: |
          out=""
          for u in https://dalawifi.com/ https://www.dalawifi.com/ https://dalawifi.com/api https://dala-genzi.ayiekofidel.workers.dev/ https://dala-genzi.ayiekofidel.workers.dev/api; do
            r=$(curl -sS -m 20 -o body.txt -w "HTTP %{http_code} size %{size_download}" "$u" 2>&1 || true)
            v=$(grep -o "const V='[0-9]*'" body.txt 2>/dev/null | head -1)
            b=$(head -c 120 body.txt 2>/dev/null | tr -d '\n\r' | tr -c '[:print:]' ' ')
            echo "::notice title=$u::$r $v | $b"
          done
          p=$(curl -sS -m 20 -X POST https://dalawifi.com/api -d '{"fn":"getStamp","args":["__wrong__"]}' 2>&1 | head -c 200)
          echo "::notice title=POST getStamp::$p"
          echo "::notice title=DNS::$(getent hosts dalawifi.com | tr '\n' ' ') / www: $(getent hosts www.dalawifi.com | tr '\n' ' ')"
