name: check-site
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live website
        run: |
          for u in https://dalawifi.com/ https://www.dalawifi.com/ https://dalawifi.com/api https://dala-genzi.ayiekofidel.workers.dev/ https://dala-genzi.ayiekofidel.workers.dev/api; do
            echo "== $u"; curl -sS -m 20 -o body.txt -w "HTTP %{http_code} size %{size_download} ip %{remote_ip}\n" "$u" || true; head -c 200 body.txt | tr -d '\n'; echo; grep -o "const V='[0-9]*'" body.txt | head -1 || true
          done
          echo "== POST getStamp (wrong pin)"; curl -sS -m 20 -X POST https://dalawifi.com/api -d '{"fn":"getStamp","args":["__wrong__"]}'; echo
          echo "== DNS"; getent hosts dalawifi.com || true; getent hosts www.dalawifi.com || true
