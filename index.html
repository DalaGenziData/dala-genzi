<meta name="theme-color" content="#0f1b33">
<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14213d;--muted:#5b6b82;--line:#e2e8f0;--head:#0f1b33;--brand:#0057A6;--brand-2:#e6eef8;--genzi:#0d9488;--good:#15803d;--good-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#92400e;--warn-bg:#fef3c7;--info-bg:#e0ecfb;--on-brand:#fff;--toast:#14213d;--toast-ink:#fff;--on-head:#fff;--on-head-2:#b9c7dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--card:#16202b;--ink:#e6edf5;--muted:#93a3b8;--line:#263445;--head:#0b2a4a;--brand:#4da3ff;--brand-2:#1b2c40;--genzi:#2dd4bf;--good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1717;--warn:#fbbf24;--warn-bg:#3a2e10;--info-bg:#16304d;--on-brand:#06121f;--toast:#e6edf5;--toast-ink:#0e151d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--card:#16202b;--ink:#e6edf5;--muted:#93a3b8;--line:#263445;--head:#0b2a4a;--brand:#4da3ff;--brand-2:#1b2c40;--genzi:#2dd4bf;--good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1717;--warn:#fbbf24;--warn-bg:#3a2e10;--info-bg:#16304d;--on-brand:#06121f;--toast:#e6edf5;--toast-ink:#0e151d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header.top{background:var(--head);color:var(--on-head);padding:12px 16px 0}
header .brand{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;margin:0 auto}
header .brandrow{display:flex;align-items:center;gap:12px;min-width:0}
header .logo{height:44px;width:auto;flex:none}
@media (max-width:520px){header .logo{height:34px}header h1{font-size:16px}}
header h1{font-size:18px;margin:0}
header .sub{font-size:12px;opacity:.8}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1200px;margin:8px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--on-head-2);padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;font:inherit;cursor:pointer}
nav button.on{color:var(--on-head);border-color:var(--on-head);font-weight:600}
@media (max-width:800px){nav{flex-wrap:wrap;overflow:visible;gap:4px;padding-bottom:6px}nav button{padding:6px 9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:13px}nav button.on{background:rgba(255,255,255,.18)}}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > select,.row > input{width:auto}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--brand-2)}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.good{color:var(--good)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--good-bg);color:var(--good)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-info{background:var(--info-bg);color:var(--brand)}
.b-dala{background:var(--brand-2);color:var(--brand)}
.b-genzi{background:color-mix(in srgb,var(--genzi) 16%,transparent);color:var(--genzi)}
.pos{color:var(--good)}
.ownbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.ownbar>div{display:flex;align-items:center;justify-content:center;min-width:0;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.ownbar span{padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.fld{display:block;margin-bottom:10px}
.fld > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fld small{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.chk input{width:auto}
.egroup{margin-bottom:12px}
.egroup h3{display:flex;gap:8px;align-items:center}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.egrid input{font-size:16px;font-variant-numeric:tabular-nums}
.etotal{font-size:18px;font-weight:700}
dialog{border:0;border-radius:14px;padding:0;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mform{padding:18px;max-height:86vh;overflow:auto}
.mform h3{font-size:17px;margin-bottom:14px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.hbars .hb{display:grid;grid-template-columns:110px 1fr 104px;gap:8px;align-items:center;margin:7px 0}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{background:var(--brand-2);border-radius:6px;height:14px;overflow:hidden}
.hbf{height:100%;background:var(--brand);border-radius:6px}
.hbf.g{background:var(--genzi)}
.hbf.neg{background:var(--bad)}
.hbv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 10px;font-size:13.5px}
.scard dt{color:var(--muted)}
.scard dd{margin:0;text-align:right}
.scard .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px;font-weight:600}
.heat td.h{text-align:right;font-size:12.5px}
.note{background:var(--info-bg);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.empty{color:var(--muted);text-align:center;padding:18px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--toast);color:var(--toast-ink);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
details summary{cursor:pointer;color:var(--brand)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;font-size:13.5px}
.drop.over{border-color:var(--brand);background:var(--brand-2)}
@media (max-width:600px){main{padding:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.kpi .v{font-size:18px}.hbars .hb{grid-template-columns:82px 1fr 90px}.card{padding:12px}}
@media print{header,nav,.noprint,.btn{display:none!important}body{background:#fff;color:#000}.card,.kpi{border-color:#ccc}}
</style>
</head>
<body>

function mergeState(cur,inc){

async function connectOnline(){

    if(!db){setNet('local');return;}
    DB=db;ONLINE=true;
    const [a,b]=await Promise.all([db.collection('state').get(),db.collection('earnings').get()]);
    lastSnaps.state=a.docs;lastSnaps.earn=b.docs;
    if((a.docs.length||b.docs.length)&&isDirty()){
      written={};a.docs.forEach(d=>written['state/'+d.id]=JSON.stringify(d.data()));b.docs.forEach(d=>written['earnings/'+d.id]=JSON.stringify(d.data()));
      S=migrate(mergeState(migrate(fromDocs(a.docs,b.docs)),S));
      try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
      scheduleSync();
    }else if(a.docs.length||b.docs.length)applyRemote();
    setNet('ok');render();
    db.collection('state').onSnapshot(q=>{lastSnaps.state=q.docs;applyRemote();},()=>setNet('err'));
    db.collection('earnings').onSnapshot(q=>{lastSnaps.earn=q.docs;applyRemote();},()=>setNet('err'));
  }catch(e){setNet('err');}
}

function rangeOf(key){
  const t=today(),d=parse(t);
  if(key==='month')return [t.slice(0,8)+'01',t];
  if(key==='lastmonth')return [iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))];

/* ---------- aggregates ---------- */
function earnIn(from,to){
  const r={bySite:{},byDate:{},total:0,days:0};
  S.sites.forEach(s=>r.bySite[s.id]={total:0,days:0,best:null,worst:null});
  for(const d in S.earnings){
    if(d<from||d>to)continue;
    let dt=0;
    for(const id in S.earnings[d]){
      const b=r.bySite[id];if(!b)continue;
      const v=num(S.earnings[d][id]);
      b.total+=v;b.days++;
      if(!b.best||v>b.best.v)b.best={d,v};
      if(!b.worst||v<b.worst.v)b.worst={d,v};
      dt+=v;
    }
    r.byDate[d]=dt;r.total+=dt;r.days++;
  }
  r.lump=0;
  (S.lumpIncome||[]).forEach(x=>{if(x.date<from||x.date>to)return;const v=num(x.amount);r.byDate[x.date]=(r.byDate[x.date]||0)+v;r.total+=v;r.lump+=v;});
  return r;
}
const DEBT_CAT='Debt payments';
function costsIn(from,to){
  // A WiFi subscription counts in full in the month it is mostly used: a payment made late last month
  // (most of its days fall in this month) is deducted from this month's profit.
  const out=[];
  S.expenses.forEach(e=>{
    let d=e.date;
    if(e.category==='Wifi subscription'&&d){
      const st=S.sites.find(x=>x.id===e.site),cyc=Math.max(1,num(st&&st.wifiCycleDays)||30),mid=addDays(d,Math.floor(cyc/2));
      if(mid.slice(0,7)!==d.slice(0,7))d=mid.slice(0,7)+'-01';
    }
    if(d>=from&&d<=to)out.push({...e,date:d,paidOn:e.date,amount:num(e.amount),src:'exp'});
  });
  S.subtech.filter(w=>w.date>=from&&w.date<=to).forEach(w=>out.push({id:w.id,date:w.date,category:SUBTECH_CAT,site:w.site,amount:num(w.amount),desc:(w.name||'Sub-tech')+': '+(w.task||'work day'),src:'sub'}));
  // equipment bought counts as money out on the day it was bought
  S.assets.filter(a=>num(a.cost)>0&&a.date&&a.date>=from&&a.date<=to).forEach(a=>out.push({id:a.id,date:a.date,category:INV_CAT,site:a.site||'general',amount:num(a.cost),desc:'Equipment: '+a.name,paidBy:a.paidBy,src:'asset'}));
  // paying back money the business owes is money out too
  S.debts.filter(d=>d.type==='weOwe').forEach(d=>(d.payments||[]).forEach((p,i)=>{if(p.date>=from&&p.date<=to&&num(p.amount))out.push({id:d.id+'-pay'+i,date:p.date,category:DEBT_CAT,site:'general',amount:num(p.amount),desc:'Debt paid to '+(d.person||'')+(p.note?' ('+p.note+')':''),paidBy:p.paidBy,src:'debt'});}));
  return out;
}

function wifiStatus(s){

}

function costByDate(from,to){const m={};costsIn(from,to).forEach(x=>m[x.date]=(m[x.date]||0)+x.amount);return m;}
function dayCalc(d){const e=S.earnings[d]?sum(Object.values(S.earnings[d])):0,c=sum(costsIn(d,d),x=>x.amount);return {e,c,p:e-c};}
function monthStats(m){const [f,t]=monthRange(m),e=earnIn(f,t),c=sum(costsIn(f,t),x=>x.amount);return {e:e.total,c,p:e.total-c,days:e.days};}
const VAR_CATS=['Motorbike fuel',SUBTECH_CAT,'Transport','Airtime / SMS'];
// Expected month-end figures: earnings at the current daily average, costs so far plus
// bills still to come (unpaid tech salary, WiFi subscriptions falling due) and day-to-day costs at the current rate.
function projection(m){
  const [f,t]=monthRange(m),tdy=today(),daysIn=diffDays(f,t)+1;
  const e=earnIn(f,t),c=costsIn(f,t),cost=sum(c,x=>x.amount);
  if(tdy>t||tdy<f){return {daysIn,projE:e.total,projC:cost,projP:e.total-cost,breakEven:cost/daysIn,final:true,extra:[]};}
  const elapsed=diffDays(f,tdy)+1,projE=e.days?e.total/e.days*daysIn:0,extra=[];
  const techPaid=sum(c.filter(x=>x.category==='Tech salary'),x=>x.amount),techLeft=Math.max(0,num(S.settings.techSalary)-techPaid);
  if(techLeft)extra.push(['Tech salary still to pay',techLeft]);
  let wifi=0;S.sites.forEach(s=>{if(!s.wifiLastPaid||!num(s.wifiAmount))return;let due=wifiDue(s);while(due<=t){if(due>tdy||due<=tdy&&due>=f&&!c.some(x=>x.category==='Wifi subscription'&&x.site===s.id&&x.date>=addDays(due,-5)))wifi+=num(s.wifiAmount);due=addDays(due,num(s.wifiCycleDays)||30);}});
  if(wifi)extra.push(['WiFi subscriptions due',wifi]);
  const varSoFar=sum(c.filter(x=>VAR_CATS.includes(x.category)),x=>x.amount),varMore=varSoFar/elapsed*(daysIn-elapsed);
  if(varMore)extra.push(['Fuel, sub-tech and other daily costs for the rest of the month',varMore]);
  const projC=cost+sum(extra,x=>x[1]);
  return {daysIn,projE,projC,projP:projE-projC,breakEven:projC/daysIn,final:false,extra,elapsed};
}

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function siteFromText(str){
  const n=String(str||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!n)return '';
  for(const s of S.sites){const sn=s.name.toLowerCase().replace(/[^a-z0-9]/g,'');if(sn&&(n===sn||n.includes(sn)))return s.id;}
  const m=n.match(/dala(?:wifi)?([1-9])/);if(m&&site('dala'+m[1]))return 'dala'+m[1];
  for(const k of ['f3b','f3c','f7'])if(n.includes(k)&&site(k))return k;
  return '';
}
function inferDate(day,mon,year){
  if(year)return year+'-'+pad(mon+1)+'-'+pad(day);
  let y=new Date().getFullYear();const tomorrow=addDays(today(),1);
  let d=y+'-'+pad(mon+1)+'-'+pad(day);
  if(d>tomorrow)d=(y-1)+'-'+pad(mon+1)+'-'+pad(day);
  return d;
}
function parseDayRows(text){
  const rows={};
  const re=/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*,?\s+(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?(?:\s+(\d{4}))?\s+(?:Ksh\.?|KES)?\s*([\d,]+(?:\.\d+)?)/gi;
  let m;while((m=re.exec(text))){const d=inferDate(Number(m[1]),MON[m[2].toLowerCase()],m[3]);if(rows[d]===undefined)rows[d]=num(m[4]);}
  return rows;
}
function htmlToText(s){return s.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');}
function decodeQP(s){return s.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}
function parseCSV(raw,file){
  const lines=raw.split(/\r?\n/).filter(l=>l.trim());
  const sep=(lines[0].match(/[;\t]/)&&!lines[0].includes(','))?lines[0].match(/[;\t]/)[0]:',';
  const split=l=>{const out=[];let cur='',q=false;for(let k=0;k<l.length;k++){const ch=l[k];if(q){if(ch==='"'&&l[k+1]==='"'){cur+='"';k++;}else if(ch==='"')q=false;else cur+=ch;}else if(ch==='"')q=true;else if(ch===sep){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;};
  const head=split(lines[0]);const out=[];
  head.forEach((h,ci)=>{if(ci===0)return;const id=siteFromText(h);if(!id)return;
    const rows={};
    lines.slice(1).forEach(l=>{const c=split(l);let d=c[0]||'';let m;
      if((m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))d=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
      else if((m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))d=m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
      else return;
      if(c[ci]!==undefined&&c[ci]!=='')rows[d]=num(c[ci]);});
    out.push({file,site:id,rows});});
  if(!out.length)out.push({file,site:'',rows:{},error:'No site columns found. The first row must be: Date, Dala 1, Dala 2, ...'});
  return out;
}
function parseUpload(raw,file){
  if(/\.(csv|txt)$/i.test(file)&&!/<html/i.test(raw.slice(0,2000))){
    if(/^[^\n]*date/i.test(raw))return parseCSV(raw,file);
  }
  let s=raw;
  if(/multipart\/related|MIME-Version/i.test(s.slice(0,3000)))s=decodeQP(s);
  const cands=[];
  const r=s.match(/[?&](?:amp;)?router=([^&"'\s#<>]+)/);if(r){try{cands.push(decodeURIComponent(r[1].replace(/\+/g,' ')));}catch(e){cands.push(r[1]);}}
  const opt=s.match(/<option[^>]*selected[^>]*>([^<]+)/i);if(opt)cands.push(opt[1]);
  cands.push(file);
  let id='';for(const c of cands){id=siteFromText(c);if(id)break;}
  const rows=parseDayRows(htmlToText(s));
  return [{file,site:id,rows,error:Object.keys(rows).length?'':'No daily figures found in this file.'}];
}
function readFiles(files){
  return Promise.all([...files].map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(parseUpload(String(r.result),f.name));r.onerror=()=>res([{file:f.name,site:'',rows:{},error:'Could not read file'}]);r.readAsText(f);}))).then(a=>{
    UI.upload=[...(UI.upload||[]),...a.flat()];UI.page='earn';render();
    document.getElementById('upCard')?.scrollIntoView({behavior:'smooth'});
  });
}

P.perf=()=>{
  const [f,t]=rangeOf(UI.perfRange),e=earnIn(f,t),all=UI.perfRange==='all';
  const len=diffDays(f,t)+1,pe=all?null:earnIn(addDays(f,-len),addDays(f,-1));
  const c=costsIn(f,t),sc={};S.sites.forEach(s=>sc[s.id]=0);c.forEach(x=>{if(sc[x.site]!==undefined)sc[x.site]+=x.amount;});
  const general=sum(c.filter(x=>!sc.hasOwnProperty(x.site)),x=>x.amount),shareGen=general/(S.sites.length||1);
  const list=S.sites.map(s=>({s,b:e.bySite[s.id],p:pe?pe.bySite[s.id].total:null})).sort((a,b)=>b.b.total-a.b.total);
  const grp=g=>sum(S.sites.filter(s=>s.group===g),s=>e.bySite[s.id].total);
  // heat table: last 14 days
  const hd=[];for(let i=13;i>=0;i--)hd.push(addDays(today(),-i));
  const maxBy={};S.sites.forEach(s=>maxBy[s.id]=Math.max(1,...hd.map(d=>num((S.earnings[d]||{})[s.id]))));
  return `
  <div class="card"><div class="h2row"><h2>Site performance</h2><select data-chg="perfRange" style="width:auto">${RANGE_OPTS.map(([v,l])=>`<option value="${v}"${v===UI.perfRange?' selected':''}>${l}</option>`).join('')}</select></div>
    <div class="kpis" style="margin-bottom:8px">
      <div class="kpi"><div class="l">All sites</div><div class="v">${fmt(e.total)}</div><div class="s">${e.days} days${pe&&pe.total?` · ${trend(pct(e.total,pe.total))} vs previous`:''}</div></div>
      <div class="kpi"><div class="l">Dala (6 sites)</div><div class="v">${fmt(grp('Dala'))}</div><div class="s">${e.total?Math.round(grp('Dala')/e.total*100):0}% of income</div></div>
      <div class="kpi"><div class="l">Genzi (3 sites)</div><div class="v">${fmt(grp('Genzi'))}</div><div class="s">${e.total?Math.round(grp('Genzi')/e.total*100):0}% of income</div></div>
    </div>
    ${hbars(list.map(x=>({label:x.s.name,v:x.b.total,cls:x.s.group==='Genzi'?'g':''})))}
  </div>
  <div class="card"><h2 style="margin-bottom:10px">Ranking and profit per site</h2>
    <div class="tbl-wrap"><table><thead><tr><th>#</th><th>Site</th><th class="n">Earnings</th><th class="n">Avg/day</th><th class="n">Best day</th><th class="n">Worst day</th><th class="n">Share</th><th class="n">vs previous</th><th class="n">Site costs</th><th class="n">Shared costs</th><th class="n">Site profit</th></tr></thead><tbody>
    ${list.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.s.name)} ${groupBadge(x.s)}</td><td class="n"><b>${fmt(x.b.total)}</b></td><td class="n">${fmt(x.b.days?x.b.total/x.b.days:0)}</td>
      <td class="n">${x.b.best?fmt(x.b.best.v)+' <span class="muted small">'+fmtDs(x.b.best.d)+'</span>':'—'}</td><td class="n">${x.b.worst?fmt(x.b.worst.v)+' <span class="muted small">'+fmtDs(x.b.worst.d)+'</span>':'—'}</td>
      <td class="n">${e.total?(x.b.total/e.total*100).toFixed(1)+'%':'—'}</td><td class="n">${x.p?trend(pct(x.b.total,x.p)):'—'}</td><td class="n">${fmt(sc[x.s.id])}</td><td class="n">${fmt(shareGen)}</td><td class="n">${pnl(x.b.total-sc[x.s.id]-shareGen)}</td></tr>`).join('')}
    </tbody></table></div>
    <p class="small muted">Site costs are running costs tagged to that site (tokens, WiFi, repairs, sub-tech days there). Shared costs tagged "General" (${fmt(general)}: fuel, salaries, transport and so on) are split equally across the ${S.sites.length} sites, so site profit deducts everything.</p>
  </div>
  <div class="card"><h2 style="margin-bottom:6px">Last 14 days by site</h2><p class="small muted" style="margin-top:0">Darker means a better day for that site. Pale or empty boxes can mean downtime or a missing entry.</p>
    <div class="tbl-wrap heat"><table><thead><tr><th>Site</th>${hd.map(d=>`<th class="n">${fmtDs(d)}</th>`).join('')}</tr></thead><tbody>
    ${S.sites.map(s=>`<tr><td>${esc(s.name)}</td>${hd.map(d=>{const r=S.earnings[d];const v=r?r[s.id]:undefined;if(v===undefined)return '<td class="h muted">—</td>';const p=Math.round(num(v)/maxBy[s.id]*55);return `<td class="h" style="background:color-mix(in srgb,${s.group==='Genzi'?'var(--genzi)':'var(--brand)'} ${p}%,transparent)">${num(v).toLocaleString('en-US')}</td>`;}).join('')}</tr>`).join('')}
    </tbody></table></div></div>`;
};
const trend=p=>p===null||!isFinite(p)?'—':`<span class="${p<0?'neg':'pos'}">${p<0?'▼':'▲'} ${Math.abs(p).toFixed(0)}%</span>`;

function partnerLedger(from,to){
  const L=[],inR=d=>d>=from&&d<=to;
  S.expenses.filter(x=>x.paidBy&&inR(x.date)).forEach(x=>L.push({date:x.date,who:x.paidBy,kind:'Paid cost',dir:1,amount:num(x.amount),note:x.category+' · '+siteName(x.site)+(x.desc?' · '+x.desc:'')}));
  S.subtech.filter(w=>w.paid&&w.paidBy&&inR(w.paidOn||w.date)).forEach(w=>L.push({date:w.paidOn||w.date,who:w.paidBy,kind:'Paid sub-tech',dir:1,amount:num(w.amount),note:(w.name||'Sub-tech')+' for '+fmtDs(w.date)}));
  S.assets.filter(x=>x.paidBy&&inR(x.date)).forEach(x=>L.push({date:x.date,who:x.paidBy,kind:'Bought equipment',dir:1,amount:num(x.cost),note:x.name+' · '+siteName(x.site)}));
  S.debts.forEach(d=>(d.payments||[]).filter(p=>p.paidBy&&inR(p.date)).forEach(p=>L.push({date:p.date,who:p.paidBy,kind:d.type==='weOwe'?'Paid business debt':'Collected debt',dir:d.type==='weOwe'?1:-1,amount:num(p.amount),note:d.person+(p.note?' · '+p.note:'')})));
  S.partnerTx.filter(x=>inR(x.date)).forEach(x=>L.push({date:x.date,who:x.person,kind:x.type==='in'?'Put money in':'Took money out',dir:x.type==='in'?1:-1,amount:num(x.amount),note:x.note||'',id:x.id}));
  return L.sort((a,b)=>b.date.localeCompare(a.date));
}

/* ---------- directors & ownership ---------- */
// Each director has a capital account. It starts at their % of the starting company value, grows with money
// they put in, falls with money they take out, and takes its share of every day's profit (or loss).
// Ownership % = their capital / everyone's capital, so it changes only when someone puts money in or takes it out.
const OWN_COLORS=['var(--brand)','var(--genzi)','#b45309','#7c3aed','#be185d'];
function ownSet(){
  const o=S.settings.own||{};
  const dirs=(o.directors&&o.directors.length?o.directors:[['FIDELIS',88],['DOROTHY',12]]).map(([n,p])=>[String(n),num(p)]);
  const firstDay=Object.keys(S.earnings).sort()[0]||today();
  return {dirs,start:o.start||firstDay,base:num(o.base),baseSet:num(o.base)>0};
}
function ownCalc(upTo){
  const o=ownSet(),t=upTo||today(),names=o.dirs.map(d=>d[0]);
  const pt=sum(o.dirs,d=>d[1])||1;
  const cap=Object.fromEntries(o.dirs.map(([n,p])=>[n,o.base*p/pt]));
  const shareNow=()=>{const tot=o.baseSet?sum(names,n=>Math.max(0,cap[n])):0;return Object.fromEntries(names.map(n=>[n,tot>0?Math.max(0,cap[n])/tot:(o.dirs.find(d=>d[0]===n)[1]/pt)]));};
  const tx=(S.equityTx||[]).filter(x=>names.includes(x.person)).map(x=>({...x,d:x.date<o.start?o.start:x.date})).sort((a,b)=>a.d.localeCompare(b.d));
  const e=earnIn(o.start,t),costBy={};
  costsIn(o.start,t).forEach(c=>{costBy[c.date]=(costBy[c.date]||0)+c.amount;});
  const days=[],tot={};names.forEach(n=>tot[n]={inj:0,wd:0,profit:0});
  let ti=0;
  for(let d=o.start;d<=t;d=addDays(d,1)){
    const sh=shareNow(),p=(e.byDate[d]||0)-(costBy[d]||0),row={date:d,profit:p,has:d in e.byDate||d in costBy,share:sh,each:{}};
    names.forEach(n=>{const v=p*sh[n];cap[n]+=v;row.each[n]=v;tot[n].profit+=v;});
    while(ti<tx.length&&tx[ti].d===d){const x=tx[ti++],v=num(x.amount);if(x.type==='in'){cap[x.person]+=v;tot[x.person].inj+=v;}else{cap[x.person]-=v;tot[x.person].wd+=v;}}
    row.after=shareNow();days.push(row);
  }
  return {o,names,cap,share:shareNow(),days,tot};
}

const CHECK_DONE=['Yes','Partly','No'];
function empStats(emp,from,to){
  const inR=d=>d>=from&&d<=to,n=emp.name;
  const ch=S.checks.filter(c=>c.emp===emp.id&&inR(c.date));
  const work=S.subtech.filter(w=>(w.name||'')===n&&inR(w.date));
  const iss=S.issues.filter(i=>i.assignedTo===n&&inR(i.date)),fixed=iss.filter(i=>i.status==='Fixed');
  const fixDays=fixed.filter(i=>i.fixedOn).map(i=>Math.max(0,diffDays(i.date,i.fixedOn)));
  const days=new Set([...ch.map(c=>c.date),...work.map(w=>w.date)]).size;
  const rated=ch.filter(c=>num(c.rating)>0),avgRating=rated.length?sum(rated,c=>c.rating)/rated.length:null;
  const doneScore=ch.length?sum(ch,c=>c.done==='Yes'?1:c.done==='Partly'?0.5:0)/ch.length:null;
  const onTime=ch.filter(c=>c.onTime!==undefined&&c.onTime!=='');const onTimePct=onTime.length?onTime.filter(c=>c.onTime==='Yes').length/onTime.length:null;
  const fixRate=iss.length?fixed.length/iss.length:null,avgFix=fixDays.length?sum(fixDays)/fixDays.length:null;
  const parts=[[avgRating!==null?avgRating/5:null,0.4],[doneScore,0.3],[onTimePct,0.15],[fixRate,0.15]].filter(x=>x[0]!==null);
  const score=parts.length?Math.round(sum(parts,x=>x[0]*x[1])/sum(parts,x=>x[1])*100):null;
  return {ch,days,tasks:ch.length,avgRating,doneScore,onTimePct,iss:iss.length,fixed:fixed.length,open:iss.length-fixed.length,avgFix,score,fixRate};
}

function reconcileBills(){
  let ch=false;
  const done=S.settings.pendingDone=S.settings.pendingDone||[];
  for(const x of PENDING){
    if(done.includes(x.id))continue;
    if(!S.expenses.some(e=>e.id===x.id||(e.site===x.site&&e.category===x.category&&num(e.amount)===num(x.amount)&&String(e.date).slice(0,7)===x.date.slice(0,7))))S.expenses.push({...x});
    done.push(x.id);ch=true;
  }
  for(const s of S.sites){
    for(const [dk,ak,cat,tag] of [['tokenLastPaid','tokenLastAmount','Electricity tokens','tok'],['wifiLastPaid','wifiAmount','Wifi subscription','wifi']]){
      const d=s[dk],a=num(s[ak]),mk=tag+'Counted';
      if(!d||!a||s[mk]===d)continue;
      if(!S.expenses.some(e=>e.site===s.id&&e.category===cat&&e.date===d)){
        S.expenses.push({id:`auto-${tag}-${s.id}-${d}`,date:d,category:cat,site:s.id,amount:a,desc:(tag==='tok'?(s.tokenMeter?'Meter '+s.tokenMeter:'Token'):(s.wifiAccount?'Acc '+s.wifiAccount:'WiFi'))+' (from site details)',paidBy:BIZ});
      }
      s[mk]=d;ch=true;
    }
  }
  return ch;
}

function addToStore(name,qty,unit,unitCost){
  let it=S.store.find(m=>m.name.toLowerCase()===name.toLowerCase());
  if(it){it.qty=num(it.qty)+qty;if(unitCost)it.unitCost=unitCost;}
  else S.store.push(it={id:uid(),name,qty,unit:unit||'pcs',unitCost:unitCost||0,minQty:0,notes:''});
  return it;
}

  ownSetup(){const o=ownSet(),d=o.dirs,F=[fDate('start','Start date (ownership counted from this day)'),{k:'base',label:'Company value on that day (Ksh)',type:'number',req:true,hint:'Total money invested in the business so far'}];

    const v={start:o.start,base:o.base||''};d.forEach(([n,p],i)=>{v['n'+i]=n;v['p'+i]=p;});

    rows.push([]);rows.push(['Ownership now',...n.map(x=>x+' '+(R.share[x]*100).toFixed(2)+'% ('+Math.round(R.cap[x])+')')]);
    download(`directors-statement-${today()}.csv`,rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');},
  printPage(){window.print();},
  editShares(){const ps=S.settings.partners;openForm('Profit shares (%)',ps.map(p=>({k:p,label:p,type:'number',hint:'Leave all at 0 to split equally'})),Object.fromEntries(ps.map(p=>[p,num(S.settings.partnerShares[p])])),o=>{S.settings.partnerShares=o;toast('Shares saved');});},
  addEmp(){openForm('Add employee',empFields,{},o=>{S.employees.push({id:uid(),...o});});},

  async delEmp(id){if(S.checks.some(c=>c.emp===id)&&!await ask('This employee has daily checks. Delete anyway?','Continue'))return;del(S.employees,id,'employee');},

  fixIssue(id){const i=byId(S.issues,id);openForm('Mark as fixed',[{k:'action',label:'What was done',type:'textarea'},fDate('fixedOn','Fixed on')],{...i,fixedOn:i.fixedOn||today()},o=>{Object.assign(i,o,{status:'Fixed'});});},

  async exportJSON(){
    const prev=S.lastBackup;S.lastBackup=today();

    else S.lastBackup=prev;
  },

    const dates=Object.keys(S.earnings).sort();
    const rows=[['Date',...S.sites.map(s=>s.name),'Total']];
    dates.forEach(d=>{const r=S.earnings[d];rows.push([d,...S.sites.map(s=>r[s.id]??''),sum(Object.values(r))]);});
    download(`dala-genzi-earnings-${today()}.csv`,rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n'),'text/csv');
  },

async function download(name,text,type){
  try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){try{await dl.save({filename:name,data:text});return true;}catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not download the file here');return false;}}}catch(e){}
  return downloadLink(name,text,type);
}
function downloadLink(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return true;}

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();goto(go.dataset.go);return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a.dataset.id,a);}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el);});
document.addEventListener('input',e=>{if(e.target.classList.contains('earnIn')){let t=0;document.querySelectorAll('.earnIn').forEach(i=>t+=num(i.value));$('#earnTot').textContent=fmt(t);$('#earnProfit').innerHTML=dayProfitTxt(t,num($('#earnTot').dataset.cost));}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('earnIn')){e.preventDefault();const all=[...document.querySelectorAll('.earnIn')],i=all.indexOf(e.target);if(i<all.length-1)all[i+1].focus();else ACT.saveDay();}});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.sites||!o.earnings)throw 0;
    ask('Add everything in this backup to the data already here? Nothing already here is deleted. Where both have the same day or entry, the backup\'s figure is used.','Restore').then(y=>{if(!y)return;S=mergeState(S,migrate(o));save();render();toast('Backup restored and combined with your data');});}catch(err){toast('That file is not a valid backup.');}
    e.target.value='';};
  r.readAsText(f);
});
$('#upFile').addEventListener('change',e=>{if(e.target.files.length)readFiles(e.target.files).then(()=>e.target.value='');});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files.length)readFiles(e.dataTransfer.files);}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES.some(x=>x[0]===p)&&p!==UI.page){UI.page=p;render();}});
function goto(p){UI.page=p;if(location.hash!=='#'+p){try{history.pushState(null,'','#'+p);}catch(e){}}render();scrollTo(0,0);}
function renderHead(){
  $('#bizName').textContent=S.settings.business||'Dala & Genzi WiFi';
  document.title=(S.settings.business||'Dala & Genzi WiFi')+' Manager';
  $('#nav').innerHTML=PAGES.map(([k,l])=>`<button data-go="${k}" class="${k===UI.page?'on':''}">${l}</button>`).join('');
  const on=$('#nav .on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function render(){renderHead();$('#main').innerHTML=P[UI.page]();}
window.addEventListener('popstate',()=>{const p=location.hash.slice(1)||'dash';if(PAGES.some(x=>x[0]===p)){UI.page=p;render();}});
if(reconcileBills()){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
render();
connectOnline();
$('#dlg').addEventListener('close',()=>{if(needApply)setTimeout(applyRemote,0);});
document.addEventListener('focusout',()=>{if(needApply)setTimeout(applyRemote,300);});
