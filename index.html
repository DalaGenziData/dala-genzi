<style>
:root{--bg:#f3f6fa;--card:#fff;--ink:#14213d;--muted:#5b6b82;--line:#e2e8f0;--head:#0f1b33;--brand:#0057A6;--brand-2:#e6eef8;--genzi:#0d9488;--good:#15803d;--good-bg:#dcfce7;--bad:#b91c1c;--bad-bg:#fee2e2;--warn:#92400e;--warn-bg:#fef3c7;--info-bg:#e0ecfb;--on-brand:#fff;--toast:#14213d;--toast-ink:#fff;--on-head:#fff;--on-head-2:#b9c7dc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e151d;--card:#16202b;--ink:#e6edf5;--muted:#93a3b8;--line:#263445;--head:#0b2a4a;--brand:#4da3ff;--brand-2:#1b2c40;--genzi:#2dd4bf;--good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1717;--warn:#fbbf24;--warn-bg:#3a2e10;--info-bg:#16304d;--on-brand:#06121f;--toast:#e6edf5;--toast-ink:#0e151d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e151d;--card:#16202b;--ink:#e6edf5;--muted:#93a3b8;--line:#263445;--head:#0b2a4a;--brand:#4da3ff;--brand-2:#1b2c40;--genzi:#2dd4bf;--good:#4ade80;--good-bg:#12321f;--bad:#f87171;--bad-bg:#3a1717;--warn:#fbbf24;--warn-bg:#3a2e10;--info-bg:#16304d;--on-brand:#06121f;--toast:#e6edf5;--toast-ink:#0e151d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header.top{background:var(--head);color:var(--on-head);padding:12px 16px 0}
header .brand{display:flex;justify-content:space-between;align-items:center;gap:10px;max-width:1200px;margin:0 auto}
header .brandrow{display:flex;align-items:center;gap:12px;min-width:0}
header .logo{height:44px;width:auto;flex:none}
@media (max-width:520px){header .logo{height:34px}header h1{font-size:16px}}
header h1{font-size:18px;margin:0}
header .sub{font-size:12px;opacity:.8}
nav{display:flex;gap:2px;overflow-x:auto;max-width:1200px;margin:8px auto 0;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--on-head-2);padding:10px 12px;border-bottom:3px solid transparent;white-space:nowrap;font:inherit;cursor:pointer}
nav button.on{color:var(--on-head);border-color:var(--on-head);font-weight:600}
#subnav{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.subnav-in{display:flex;gap:6px;max-width:1200px;margin:0 auto;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
.subnav-in::-webkit-scrollbar{display:none}
.subnav-in button{background:var(--bg);border:1px solid var(--line);color:var(--ink);padding:7px 14px;border-radius:99px;white-space:nowrap;font:inherit;font-size:14px;cursor:pointer}
.subnav-in button.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand);font-weight:600}
@media (max-width:800px){nav{flex-wrap:wrap;overflow:visible;gap:4px;padding-bottom:6px}nav button{padding:6px 9px;border:1px solid rgba(255,255,255,.35);border-radius:8px;font-size:13px}nav button.on{background:rgba(255,255,255,.18)}}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px}
.h2row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:17px;margin:0}
h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row > select,.row > input{width:auto}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:middle}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
td.n,th.n{text-align:right}
td.wrap{white-space:normal;min-width:160px}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--brand-2)}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn.good{color:var(--good)}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--good-bg);color:var(--good)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-info{background:var(--info-bg);color:var(--brand)}
.b-dala{background:var(--brand-2);color:var(--brand)}
.b-genzi{background:color-mix(in srgb,var(--genzi) 16%,transparent);color:var(--genzi)}
.pos{color:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}.legend i{display:inline-block;width:12px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.chart{overflow-x:auto}
.donut{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut text{fill:var(--muted);font-size:11px}.donut .dt{fill:var(--ink);font-size:20px;font-weight:700}
.dleg{flex:1;min-width:220px}.dleg div{display:grid;grid-template-columns:14px 1fr auto 40px;gap:8px;align-items:center;padding:3px 0;font-size:14px}.dleg i{width:12px;height:12px;border-radius:3px}.dleg b{font-weight:600}
.report h3{margin:16px 0 6px}.rhead{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:2px solid var(--brand)}
@media print{#subnav,#fab{display:none!important}.report{border:0;padding:0}main{padding:0!important}}
.hbtn{background:transparent!important;color:var(--on-head)!important;border-color:var(--on-head-2)!important}
#fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;border:0;background:var(--brand);color:var(--on-brand);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:20}
.steps{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
.step{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;font-size:12px;color:var(--muted)}
.step:not(:last-child)::after{content:'';position:absolute;top:13px;left:calc(50% + 15px);right:calc(-50% + 15px);height:3px;background:var(--line);border-radius:2px}
.step.done:not(:last-child)::after{background:var(--good)}
.step .dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted);font-weight:700;margin-bottom:4px}
.step.done .dot{background:var(--good);color:#fff}
.step.next .dot{background:var(--warn-bg);color:var(--warn);outline:2px solid var(--warn)}
.step.done .sl{color:var(--ink);font-weight:600}
.step .st{font-size:11px;margin-top:2px}
@media (max-width:520px){.step{font-size:10.5px}.step .st{font-size:9.5px}.step .dot{width:24px;height:24px}.step:not(:last-child)::after{top:11px}}
main{padding-bottom:90px!important}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.ownbar{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:12px;border:1px solid var(--line)}
.ownbar>div{display:flex;align-items:center;justify-content:center;min-width:0;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.ownbar span{padding:0 6px;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--bad)}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.fld{display:block;margin-bottom:10px}
.fld > span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fld small{color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.chk input{width:auto}
.egroup{margin-bottom:12px}
.egroup h3{display:flex;gap:8px;align-items:center}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.egrid input{font-size:16px;font-variant-numeric:tabular-nums}
.etotal{font-size:18px;font-weight:700}
dialog{border:0;border-radius:14px;padding:0;width:min(480px,94vw);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.mform{padding:18px;max-height:86vh;overflow:auto}
.mform h3{font-size:17px;margin-bottom:14px}
.mact{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two>*{min-width:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.hbars .hb{display:grid;grid-template-columns:110px 1fr 104px;gap:8px;align-items:center;margin:7px 0}
.hbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{background:var(--brand-2);border-radius:6px;height:14px;overflow:hidden}
.hbf{height:100%;background:var(--brand);border-radius:6px}
.hbf.g{background:var(--genzi)}
.hbf.neg{background:var(--bad)}
.hbv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px}
.alerts{list-style:none;margin:0;padding:0}
.alerts li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.alerts li:last-child{border-bottom:0}
.scards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.scard dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:6px 0 10px;font-size:13.5px}
.scard dt{color:var(--muted)}
.scard dd{margin:0;text-align:right}
.scard .sec{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:8px;font-weight:600}

.drop{border:2px dashed var(--line);border-radius:10px;padding:14px;font-size:13.5px}
.drop.over{border-color:var(--brand);background:var(--brand-2)}
@media (max-width:600px){main{padding:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}.kpi .v{font-size:18px}.hbars .hb{grid-template-columns:82px 1fr 90px}.card{padding:12px}}

html.big body{zoom:1.15}
</style>

const RANGE_OPTS=[['7','Last 7 days'],['14','Last 14 days'],['30','Last 30 days'],['month','This month'],['lastmonth','Last month'],['90','Last 90 days'],['all','All time']];
function rangeOf(key){
  const t=today(),d=parse(t);
  if(key==='month')return [t.slice(0,8)+'01',t];
  if(key==='lastmonth')return [iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))];
  if(key==='all')return ['0000-01-01','9999-12-31'];
  if(key==='week'||key==='lastweek'){const mon=addDays(t,-((d.getDay()+6)%7));return key==='week'?[mon,t]:[addDays(mon,-7),addDays(mon,-1)];}
  return [addDays(t,-(Number(key)-1)),t];
}

/* ---------- aggregates ---------- */
function earnIn(from,to){
  const r={bySite:{},byDate:{},total:0,days:0};
  S.sites.forEach(s=>r.bySite[s.id]={total:0,days:0,best:null,worst:null});
  for(const d in S.earnings){
    if(d<from||d>to)continue;
    let dt=0;
    for(const id in S.earnings[d]){
      const b=r.bySite[id];if(!b)continue;
      const v=num(S.earnings[d][id]);
      b.total+=v;b.days++;
      if(!b.best||v>b.best.v)b.best={d,v};
      if(!b.worst||v<b.worst.v)b.worst={d,v};
      dt+=v;
    }
    r.byDate[d]=dt;r.total+=dt;r.days++;
  }
  r.lump=0;
  (S.lumpIncome||[]).forEach(x=>{if(x.date<from||x.date>to)return;const v=num(x.amount);r.byDate[x.date]=(r.byDate[x.date]||0)+v;r.total+=v;r.lump+=v;});
  return r;
}
const DEBT_CAT='Debt payments';
function costsIn(from,to){
  // A WiFi subscription counts in full in the month it is mostly used: a payment made late last month
  // (most of its days fall in this month) is deducted from this month's profit.
  const out=[];
  S.expenses.forEach(e=>{
    let d=e.date;
    if(e.category==='Wifi subscription'&&d){
      const st=S.sites.find(x=>x.id===e.site),cyc=Math.max(1,num(st&&st.wifiCycleDays)||30),mid=addDays(d,Math.floor(cyc/2));
      if(mid.slice(0,7)!==d.slice(0,7))d=mid.slice(0,7)+'-01';
    }
    if(d>=from&&d<=to)out.push({...e,date:d,paidOn:e.date,amount:num(e.amount),src:'exp'});
  });
  S.subtech.filter(w=>w.date>=from&&w.date<=to).forEach(w=>out.push({id:w.id,date:w.date,category:SUBTECH_CAT,site:w.site,amount:num(w.amount),desc:(w.name||'Sub-tech')+': '+(w.task||'work day'),src:'sub'}));
  // equipment bought counts as money out on the day it was bought
  S.assets.filter(a=>num(a.cost)>0&&a.date&&a.date>=from&&a.date<=to).forEach(a=>out.push({id:a.id,date:a.date,category:INV_CAT,site:a.site||'general',amount:num(a.cost),desc:'Equipment: '+a.name,paidBy:a.paidBy,src:'asset'}));
  // paying back money the business owes is money out too
  S.debts.filter(d=>d.type==='weOwe').forEach(d=>(d.payments||[]).forEach((p,i)=>{if(p.date>=from&&p.date<=to&&num(p.amount))out.push({id:d.id+'-pay'+i,date:p.date,category:DEBT_CAT,site:'general',amount:num(p.amount),desc:'Debt paid to '+(d.person||'')+(p.note?' ('+p.note+')':''),paidBy:p.paidBy,src:'debt'});}));
  return out;
}
const debtPaid=d=>sum(d.payments||[],p=>p.amount);
const debtBal=d=>num(d.amount)-debtPaid(d);
function wifiDue(s){return s.wifiLastPaid?addDays(s.wifiLastPaid,num(s.wifiCycleDays)||30):'';}
function wifiStatus(s){
  if(!s.wifiLastPaid)return {cls:'b-info',txt:'Not set',left:null};
  const left=diffDays(today(),wifiDue(s));
  if(left<0)return {cls:'b-bad',txt:`Overdue ${-left}d`,left};
  if(left<=num(S.settings.wifiWarnDays))return {cls:'b-warn',txt:left===0?'Due today':`Due in ${left}d`,left};
  return {cls:'b-ok',txt:`${left} days left`,left};
}
function tokenStatus(s){
  if(!s.tokenLastPaid)return {cls:'b-info',txt:'Not set',ago:null};
  const ago=diffDays(s.tokenLastPaid,today());
  return {cls:ago>=num(S.settings.tokenWarnDays)?'b-warn':'b-ok',txt:ago===0?'Today':`${ago} days ago`,ago};
}

/* ---------- calculations ---------- */
function costByDate(from,to){const m={};costsIn(from,to).forEach(x=>m[x.date]=(m[x.date]||0)+x.amount);return m;}
function dayCalc(d){const e=S.earnings[d]?sum(Object.values(S.earnings[d])):0,c=sum(costsIn(d,d),x=>x.amount);return {e,c,p:e-c};}
function monthStats(m){const [f,t]=monthRange(m),e=earnIn(f,t),c=sum(costsIn(f,t),x=>x.amount);return {e:e.total,c,p:e.total-c,days:e.days};}
const VAR_CATS=['Motorbike fuel',SUBTECH_CAT,'Transport','Airtime / SMS'];
// Expected month-end figures: earnings at the current daily average, costs so far plus
// bills still to come (unpaid tech salary, WiFi subscriptions falling due) and day-to-day costs at the current rate.
function projection(m){
  const [f,t]=monthRange(m),tdy=today(),daysIn=diffDays(f,t)+1;
  const e=earnIn(f,t),c=costsIn(f,t),cost=sum(c,x=>x.amount);
  if(tdy>t||tdy<f){return {daysIn,projE:e.total,projC:cost,projP:e.total-cost,breakEven:cost/daysIn,final:true,extra:[]};}
  const elapsed=diffDays(f,tdy)+1,projE=e.days?e.total/e.days*daysIn:0,extra=[];
  const techPaid=sum(c.filter(x=>x.category==='Tech salary'),x=>x.amount),techLeft=Math.max(0,num(S.settings.techSalary)-techPaid);
  if(techLeft)extra.push(['Tech salary still to pay',techLeft]);
  let wifi=0;S.sites.forEach(s=>{if(!s.wifiLastPaid||!num(s.wifiAmount))return;let due=wifiDue(s);while(due<=t){if(due>tdy||due<=tdy&&due>=f&&!c.some(x=>x.category==='Wifi subscription'&&x.site===s.id&&x.date>=addDays(due,-5)))wifi+=num(s.wifiAmount);due=addDays(due,num(s.wifiCycleDays)||30);}});
  if(wifi)extra.push(['WiFi subscriptions due',wifi]);
  const varSoFar=sum(c.filter(x=>VAR_CATS.includes(x.category)),x=>x.amount),varMore=varSoFar/elapsed*(daysIn-elapsed);
  if(varMore)extra.push(['Fuel, sub-tech and other daily costs for the rest of the month',varMore]);
  const projC=cost+sum(extra,x=>x[1]);
  return {daysIn,projE,projC,projP:projE-projC,breakEven:projC/daysIn,final:false,extra,elapsed};
}
function profitNote(){const st=monthStats(today().slice(0,7));return `This month ${st.p<0?'loss':'profit'}: ${fmt(Math.abs(st.p))}`;}

const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,oct:9,nov:10,dec:11};
function siteFromText(str){
  const n=String(str||'').toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!n)return '';
  for(const s of S.sites){const sn=s.name.toLowerCase().replace(/[^a-z0-9]/g,'');if(sn&&(n===sn||n.includes(sn)))return s.id;}
  const m=n.match(/dala(?:wifi)?([1-9])/);if(m&&site('dala'+m[1]))return 'dala'+m[1];
  for(const k of ['f3b','f3c','f7'])if(n.includes(k)&&site(k))return k;
  return '';
}
function inferDate(day,mon,year){
  if(year)return year+'-'+pad(mon+1)+'-'+pad(day);
  let y=new Date().getFullYear();const tomorrow=addDays(today(),1);
  let d=y+'-'+pad(mon+1)+'-'+pad(day);
  if(d>tomorrow)d=(y-1)+'-'+pad(mon+1)+'-'+pad(day);
  return d;
}
function parseDayRows(text){
  const rows={};
  const re=/\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*,?\s+(\d{1,2})\s+(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?(?:\s+(\d{4}))?\s+(?:Ksh\.?|KES)?\s*([\d,]+(?:\.\d+)?)/gi;
  let m;while((m=re.exec(text))){const d=inferDate(Number(m[1]),MON[m[2].toLowerCase()],m[3]);if(rows[d]===undefined)rows[d]=num(m[4]);}
  return rows;
}
function htmlToText(s){return s.replace(/<script[\s\S]*?<\/script>/gi,' ').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ');}
function decodeQP(s){return s.replace(/=\r?\n/g,'').replace(/=([0-9A-F]{2})/g,(m,h)=>String.fromCharCode(parseInt(h,16)));}
function parseCSV(raw,file){
  const lines=raw.split(/\r?\n/).filter(l=>l.trim());
  const sep=(lines[0].match(/[;\t]/)&&!lines[0].includes(','))?lines[0].match(/[;\t]/)[0]:',';
  const split=l=>{const out=[];let cur='',q=false;for(let k=0;k<l.length;k++){const ch=l[k];if(q){if(ch==='"'&&l[k+1]==='"'){cur+='"';k++;}else if(ch==='"')q=false;else cur+=ch;}else if(ch==='"')q=true;else if(ch===sep){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out;};
  const head=split(lines[0]);const out=[];
  head.forEach((h,ci)=>{if(ci===0)return;const id=siteFromText(h);if(!id)return;
    const rows={};
    lines.slice(1).forEach(l=>{const c=split(l);let d=c[0]||'';let m;
      if((m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)))d=m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
      else if((m=d.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/)))d=m[3]+'-'+pad(m[2])+'-'+pad(m[1]);
      else return;
      if(c[ci]!==undefined&&c[ci]!=='')rows[d]=num(c[ci]);});
    out.push({file,site:id,rows});});
  if(!out.length)out.push({file,site:'',rows:{},error:'No site columns found. The first row must be: Date, Dala 1, Dala 2, ...'});
  return out;
}
function parseUpload(raw,file){
  if(/\.(csv|txt)$/i.test(file)&&!/<html/i.test(raw.slice(0,2000))){
    if(/^[^\n]*date/i.test(raw))return parseCSV(raw,file);
  }
  let s=raw;
  if(/multipart\/related|MIME-Version/i.test(s.slice(0,3000)))s=decodeQP(s);
  const cands=[];
  const r=s.match(/[?&](?:amp;)?router=([^&"'\s#<>]+)/);if(r){try{cands.push(decodeURIComponent(r[1].replace(/\+/g,' ')));}catch(e){cands.push(r[1]);}}
  const opt=s.match(/<option[^>]*selected[^>]*>([^<]+)/i);if(opt)cands.push(opt[1]);
  cands.push(file);
  let id='';for(const c of cands){id=siteFromText(c);if(id)break;}
  const rows=parseDayRows(htmlToText(s));
  return [{file,site:id,rows,error:Object.keys(rows).length?'':'No daily figures found in this file.'}];
}
function readFiles(files){
  return Promise.all([...files].map(f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(parseUpload(String(r.result),f.name));r.onerror=()=>res([{file:f.name,site:'',rows:{},error:'Could not read file'}]);r.readAsText(f);}))).then(a=>{
    UI.upload=[...(UI.upload||[]),...a.flat()];UI.page='earn';render();
    document.getElementById('upCard')?.scrollIntoView({behavior:'smooth'});
  });
}

// Net profit per site for a period: each site's own tokens, WiFi and other costs, plus an equal share of shared costs.
function siteNet(e,c,title){
  const ids=S.sites.map(s=>s.id),row={};S.sites.forEach(s=>row[s.id]={tok:0,wifi:0,oth:0});let shared=0;
  c.forEach(x=>{const r=row[x.site];if(!r){shared+=x.amount;return;}if(x.category==='Electricity tokens')r.tok+=x.amount;else if(x.category==='Wifi subscription')r.wifi+=x.amount;else r.oth+=x.amount;});
  const sh=shared/(ids.length||1),miss=v=>v?fmt(v):'<span class="badge b-warn">not entered</span>';
  const rows=S.sites.map(s=>{const r=row[s.id],en=e.bySite[s.id].total,net=en-r.tok-r.wifi-r.oth-sh;return {s,r,en,net};});
  const T=k=>sum(rows,x=>x.r[k]),lump=e.lump||0,net=e.total-sum(c,x=>x.amount);
  return `<div class="card"><h2 style="margin-bottom:6px">${title}</h2>
    <p class="small muted" style="margin-top:0">Each site's own token and WiFi payments are deducted from that site. "Not entered" means no payment was recorded for that site in this period, so pay it in Tokens &amp; WiFi and it is deducted at once. Shared costs (fuel, salaries, transport…) are split equally across the ${ids.length} sites.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Site</th><th class="n">Earnings</th><th class="n">Token</th><th class="n">WiFi</th><th class="n">Other site costs</th><th class="n">Shared share</th><th class="n">Net profit</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${esc(x.s.name)}</td><td class="n">${fmt(x.en)}</td><td class="n">${miss(x.r.tok)}</td><td class="n">${miss(x.r.wifi)}</td><td class="n">${fmt(x.r.oth)}</td><td class="n">${fmt(sh)}</td><td class="n">${pnl(x.net)}</td></tr>`).join('')}
    ${lump?`<tr><td>Monthly totals (no site split)</td><td class="n">${fmt(lump)}</td><td></td><td></td><td></td><td></td><td class="n">${pnl(lump)}</td></tr>`:''}
    </tbody><tfoot><tr><td>All sites</td><td class="n">${fmt(e.total)}</td><td class="n">${fmt(T('tok'))}</td><td class="n">${fmt(T('wifi'))}</td><td class="n">${fmt(T('oth'))}</td><td class="n">${fmt(shared)}</td><td class="n">${pnl(net)}</td></tr></tfoot></table></div></div>`;
}
function profitBreakdown(earn,c,title){
  const byCat={};c.forEach(x=>byCat[x.category]=(byCat[x.category]||0)+x.amount);
  const tot=sum(c,x=>x.amount),p=earn-tot;
  return `<div class="card"><h2 style="margin-bottom:10px">${title}</h2><div class="tbl-wrap"><table><tbody>
    <tr><td><b>Earnings (all sites)</b></td><td class="n"><b>${fmt(earn)}</b></td></tr>
    ${Object.entries(byCat).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>minus ${esc(k)}</td><td class="n neg">−${fmt(v)}</td></tr>`).join('')||'<tr><td class="muted">No costs recorded yet</td><td></td></tr>'}
    </tbody><tfoot><tr><td>${p<0?'Loss':'Profit'} after deducting everything</td><td class="n ${p<0?'neg':'pos'}">${fmt(p)}</td></tr></tfoot></table></div>
    <p class="small muted" style="margin:6px 0 0">Every cost is deducted: tokens, WiFi subscriptions, motorbike fuel, salaries, sub-tech days, materials, repairs, transport, equipment, debts the business pays back, and anything else in Running Costs. A WiFi payment made late last month counts in this month, because that is when it is used. It updates the moment you save.</p></div>`;
}

function prevEarn(id,d){const ds=Object.keys(S.earnings).filter(x=>x<d&&S.earnings[x][id]!==undefined).sort();const x=ds[ds.length-1];return x?{d:x,v:num(S.earnings[x][id])}:null;}

const earnOdd=(v,u)=>u>0&&v>0&&(v>u*3||v<u/3)?(v>u?'Check: over 3 times the usual':'Check: under a third of the usual'):'';

/* ---------- weekly costs: what running the sites costs per week (Monday to Sunday) and a weekly budget ---------- */
const weekMon=d=>addDays(d,-((parse(d).getDay()+6)%7));
const WK_GROUPS=[['Tokens',['Electricity tokens']],['WiFi',['Wifi subscription']],['Fuel & transport',['Motorbike fuel','Transport']],['Materials & repairs',['Materials','Repairs & maintenance']],['Wages',['Tech salary',SUBTECH_CAT]]];
function weekRow(mon){const sun=addDays(mon,6),to=sun<today()?sun:today(),c=costsIn(mon,to),run=c.filter(x=>x.category!==INV_CAT);
  const g=WK_GROUPS.map(([n,cats])=>sum(run.filter(x=>cats.includes(x.category)),x=>x.amount));
  return {mon,sun,run:sum(run,x=>x.amount),inv:sum(c,x=>x.amount)-sum(run,x=>x.amount),g,other:sum(run,x=>x.amount)-sum(g),earn:earnIn(mon,to).total};}
function weekBudget(){const a=S.settings.weekBudget;if(num(a)>0)return {v:num(a),set:true};
  const cur=weekMon(today()),past=[];for(let i=1;i<=8;i++)past.push(weekRow(addDays(cur,-7*i)));const used=past.filter(w=>w.run>0);
  return {v:used.length?Math.round(sum(used,w=>w.run)/used.length):0,set:false,n:used.length};}
P.weekly=()=>{
  const cur=weekMon(today()),rows=[];for(let i=0;i<12;i++)rows.push(weekRow(addDays(cur,-7*i)));
  const B=weekBudget(),now=rows[0],left=B.v-now.run,pct=B.v?Math.min(100,Math.round(now.run/B.v*100)):0;
  const full=rows.slice(1).filter(w=>w.run>0),avg=full.length?sum(full,w=>w.run)/full.length:0,avgE=full.length?sum(full,w=>w.earn)/full.length:0;

      <div class="kpi"><div class="l">Spent so far</div><div class="v">${fmt(now.run)}</div><div class="s">${pct}% of budget</div></div>

      <div class="kpi"><div class="l">Earned this week</div><div class="v">${fmt(now.earn)}</div><div class="s">${now.earn-now.run<0?'loss ':'after costs '}${fmt(now.earn-now.run)}</div></div></div>
    <div class="bar" style="height:10px;background:var(--line);border-radius:6px;overflow:hidden"><div style="width:${pct}%;height:100%;background:${left<0?'var(--bad,#c0392b)':'var(--brand)'}"></div></div>
    <p class="small muted">Running costs only: tokens, WiFi, fuel, transport, materials, repairs, wages and other day-to-day costs. Equipment &amp; investment is shown separately because it is not a weekly cost.</p>
  </div>
  <div class="card"><h2 style="margin-bottom:6px">Per week, last 12 weeks</h2>
    <p class="small muted" style="margin-top:0">Average week: costs <b>${fmt(avg)}</b>, earnings <b>${fmt(avgE)}</b>. So about <b>${fmt(avg)}</b> a week is what it takes to run the sites.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Week</th>${WK_GROUPS.map(([n])=>`<th class="n">${n}</th>`).join('')}<th class="n">Other</th><th class="n">Running costs</th><th class="n">Equipment</th><th class="n">Earnings</th><th class="n">After costs</th></tr></thead><tbody>
    ${rows.map((w,i)=>`<tr><td>${fmtDs(w.mon)} – ${fmtDs(w.sun)}${i===0?' <span class="badge b-info">now</span>':''}</td>${w.g.map(v=>`<td class="n">${v?fmt(v):''}</td>`).join('')}<td class="n">${w.other?fmt(w.other):''}</td><td class="n"><b>${fmt(w.run)}</b>${B.v&&w.run>B.v?' <span class="badge b-warn">over</span>':''}</td><td class="n">${w.inv?fmt(w.inv):''}</td><td class="n">${fmt(w.earn)}</td><td class="n">${pnl(w.earn-w.run-w.inv)}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;

/* ---------- data check: gaps and doubtful figures that would spoil the analysis ---------- */
function dataGaps(){
  const t=today(),G=[],days=Object.keys(S.earnings).sort(),first=days[0]||t,from=[first,addDays(t,-60)].sort()[1];
  const miss=[],part=[];for(let d=from;d<t;d=addDays(d,1)){const r=S.earnings[d];if(!r)miss.push(d);else{const n=S.sites.filter(x=>r[x.id]===undefined).map(x=>x.name);if(n.length&&n.length<S.sites.length)part.push([d,n]);}}
  G.push({k:'Days with no earnings',why:'Every day without figures makes averages, forecasts and site ranking wrong.',items:miss.map(d=>({t:fmtD(d),act:'gotoDay',id:d,btn:'Enter'}))});
  G.push({k:'Days with some sites missing',why:'A missing site counts as zero for that day.',items:part.map(([d,n])=>({t:fmtD(d)+': '+n.join(', '),act:'gotoDay',id:d,btn:'Fix'}))});
  const odd=[];days.filter(d=>d>=addDays(t,-30)).forEach(d=>S.sites.forEach(x=>{const v=num(S.earnings[d][x.id]),u=usualEarn(x.id,d);if(earnOdd(v,u))odd.push({t:`${fmtD(d)} · ${x.name}: ${fmt(v)} (usual ${fmt(u)})`,act:'gotoDay',id:d,btn:'Check'});}));
  G.push({k:'Unusual earnings (last 30 days)',why:'Over 3 times or under a third of the usual for that site. Check for a typing mistake.',items:odd});
  G.push({k:'Costs with no site',why:'Tokens and WiFi must name the site, or the site looks cheaper than it is.',items:S.expenses.filter(x=>(x.category==='Electricity tokens'||x.category==='Wifi subscription')&&!S.sites.some(y=>y.id===x.site)).map(x=>({t:`${fmtD(x.date)} · ${x.category} · ${fmt(num(x.amount))}`,act:'editExp',id:x.id,btn:'Fix'}))});
  G.push({k:'Costs with no amount',why:'A cost of 0 is usually a mistake.',items:S.expenses.filter(x=>!(num(x.amount)>0)).map(x=>({t:`${fmtD(x.date)} · ${x.category||'No category'}`,act:'editExp',id:x.id,btn:'Fix'}))});
  const meters=[];S.sites.forEach(x=>{if(!x.tokenMeter)meters.push({t:x.name+': main token meter',act:'editSite',id:x.id,btn:'Add'});(x.subs||[]).forEach((u,i)=>{if(!u.meter)meters.push({t:x.name+': '+(u.name||'Sub power '+(i+1)),act:'editSub',id:x.id+':'+i,btn:'Add'});});});
  G.push({k:'Token meters with no number',why:'Needed to pay tokens and to match token costs to the right meter.',items:meters});
  G.push({k:'Sites with no WiFi account',why:'Needed to track WiFi due dates.',items:S.sites.filter(x=>!x.wifiAccount).map(x=>({t:x.name,act:'editSite',id:x.id,btn:'Add'}))});
  G.push({k:'Employees with no phone',why:'Needed to send customer issues to the technician.',items:S.employees.filter(x=>!x.phone).map(x=>({t:x.name,act:'editEmp',id:x.id,btn:'Add'}))});
  return G;
}
P.gaps=()=>{
  const G=dataGaps(),n=sum(G,g=>g.items.length);
  return `<div class="card"><h2 style="margin-bottom:6px">Data check</h2><p class="small muted" style="margin-top:0">Good analysis needs complete, correct figures. ${n?`<b>${n}</b> thing${n>1?'s':''} to fix below.`:'Everything looks complete.'}</p></div>

P.pl=()=>{

P.targets=()=>{
  const m=UI.tgtMonth||today().slice(0,7),[f,t]=monthRange(m),e=earnIn(f,t),tdy=today();
  const daysIn=diffDays(f,t)+1,cur=tdy>=f&&tdy<=t,left=cur?diffDays(tdy,t):0;
  const rows=S.sites.map(s=>{const tg=num(S.targets[s.id]),b=e.bySite[s.id],exp=cur&&b.days?b.total/b.days*daysIn:b.total;
    return {s,tg,got:b.total,exp,pct:tg?b.total/tg*100:0,need:tg&&left?Math.max(0,tg-b.total)/left:0};});
  const T=sum(rows,r=>r.tg),G=sum(rows,r=>r.got),X=sum(rows,r=>r.exp);
  const status=r=>!r.tg?'<span class="badge b-info">No target</span>':r.got>=r.tg?'<span class="badge b-ok">Reached</span>':!cur?'<span class="badge b-bad">Missed</span>':r.exp>=r.tg?'<span class="badge b-ok">On track</span>':'<span class="badge b-warn">Behind</span>';
  return `
  <div class="card"><div class="h2row"><h2>Monthly targets</h2><div class="row">${monthSelect('tgtMonth',m)}<button class="btn primary" data-act="editTargets">Set targets</button></div></div>
    <div class="note">Set how much each site should earn in a month. The page shows progress, whether each site is on track, and how much it must earn per day for the rest of the month to reach its target.</div>
    <div class="kpis"><div class="kpi"><div class="l">Target, all sites</div><div class="v">${fmt(T)}</div></div>
      <div class="kpi"><div class="l">Earned so far</div><div class="v">${fmt(G)}</div><div class="s">${T?Math.round(G/T*100)+'% of target':''}</div></div>
      <div class="kpi"><div class="l">Expected by month end</div><div class="v ${T&&X<T?'neg':''}">${fmt(X)}</div><div class="s">${T?(X>=T?'Above target':'Short by '+fmt(T-X)):''}</div></div></div>
    <div class="tbl-wrap"><table><thead><tr><th>Site</th><th class="n">Target</th><th class="n">Earned</th><th style="min-width:120px">Progress</th><th class="n">Expected</th><th class="n">Needed / day</th><th>Status</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${esc(r.s.name)}</td><td class="n">${r.tg?fmt(r.tg):'—'}</td><td class="n">${fmt(r.got)}</td>
      <td><div class="hbt"><div class="hbf ${r.s.group==='Genzi'?'g':''}" style="width:${Math.min(100,r.pct)}%"></div></div><span class="small muted">${r.tg?Math.round(r.pct)+'%':''}</span></td>
      <td class="n">${fmt(r.exp)}</td><td class="n">${r.tg&&cur?fmt(r.need):'—'}</td><td>${status(r)}</td></tr>`).join('')}
    </tbody></table></div>
    ${!T?'<p class="small muted">No targets yet. Tap <b>Set targets</b>. A good start is each site\'s average for the last 30 days.</p>':''}
  </div>`;

function partnerLedger(from,to){
  const L=[],inR=d=>d>=from&&d<=to;
  S.expenses.filter(x=>x.paidBy&&inR(x.date)).forEach(x=>L.push({date:x.date,who:x.paidBy,kind:'Paid cost',dir:1,amount:num(x.amount),note:x.category+' · '+siteName(x.site)+(x.desc?' · '+x.desc:'')}));

const OWN_COLORS=['var(--brand)','var(--genzi)','#b45309','#7c3aed','#be185d'];
function ownSet(){
  const o=S.settings.own||{};
  const dirs=(o.directors&&o.directors.length?o.directors:[['FIDELIS',88],['DOROTHY',12]]).map(([n,p])=>[String(n),num(p)]);
  const firstDay=Object.keys(S.earnings).sort()[0]||today();
  return {dirs,start:o.start||firstDay,base:num(o.base),baseSet:num(o.base)>0};
}
function ownCalc(upTo){
  const o=ownSet(),t=upTo||today(),names=o.dirs.map(d=>d[0]);
  const pt=sum(o.dirs,d=>d[1])||1;
  const cap=Object.fromEntries(o.dirs.map(([n,p])=>[n,o.base*p/pt]));
  const shareNow=()=>{const tot=o.baseSet?sum(names,n=>Math.max(0,cap[n])):0;return Object.fromEntries(names.map(n=>[n,tot>0?Math.max(0,cap[n])/tot:(o.dirs.find(d=>d[0]===n)[1]/pt)]));};
  const tx=(S.equityTx||[]).filter(x=>names.includes(x.person)).map(x=>({...x,d:x.date<o.start?o.start:x.date})).sort((a,b)=>a.d.localeCompare(b.d));
  const e=earnIn(o.start,t),costBy={};
  costsIn(o.start,t).forEach(c=>{costBy[c.date]=(costBy[c.date]||0)+c.amount;});
  const days=[],tot={};names.forEach(n=>tot[n]={inj:0,wd:0,profit:0});
  let ti=0;
  for(let d=o.start;d<=t;d=addDays(d,1)){
    const sh=shareNow(),p=(e.byDate[d]||0)-(costBy[d]||0),row={date:d,profit:p,has:d in e.byDate||d in costBy,share:sh,each:{}};
    names.forEach(n=>{const v=p*sh[n];cap[n]+=v;row.each[n]=v;tot[n].profit+=v;});
    while(ti<tx.length&&tx[ti].d===d){const x=tx[ti++],v=num(x.amount);if(x.type==='in'){cap[x.person]+=v;tot[x.person].inj+=v;}else{cap[x.person]-=v;tot[x.person].wd+=v;}}
    row.after=shareNow();days.push(row);
  }
  return {o,names,cap,share:shareNow(),days,tot};
}

function reminderText(){
  const days=num(S.settings.remindDays)||3,L=upcomingList().filter(x=>x.left!==null&&x.left<=days&&x.amount>0);
  const line=x=>`- ${x.who}: ${x.what} ${x.amount?fmt(x.amount):''}${x.left<0?` (${-x.left} days late)`:x.left===0?' (today)':` (in ${x.left} day${x.left>1?'s':''}, ${fmtDs(x.date)})`}`;
  const od=L.filter(x=>x.left<0),td=L.filter(x=>x.left===0),soon=L.filter(x=>x.left>0);
  if(!L.length)return {n:0,text:`DalaWifi update ${fmtDs(today())}: nothing overdue and nothing due in the next ${days} days. ${profitNote()}.`};
  const parts=[`DalaWifi reminder ${fmtDs(today())}`];
  if(od.length)parts.push('OVERDUE:',...od.map(line));
  if(td.length)parts.push('DUE TODAY:',...td.map(line));
  if(soon.length)parts.push(`DUE IN ${days} DAYS:`,...soon.map(line));
  parts.push(`Total: ${fmt(sum(L,x=>x.amount))}`,profitNote(),'Details: https://dalawifi.com/#upcoming');
  return {n:L.length,od:od.length,text:parts.join('\n')};
}

/* ---------- activity history and undo ---------- */
// each person's code (FIDEL's choice: their phone numbers), stamped on every record they add or change
const myCode=()=>{const n=String(meName()||'').trim().toUpperCase(),c=S.settings.codes||{};return c[n]||c[n.split(' ')[0]]||'';};
function stampSnap(){const m={};for(const k in S){if(k==='activity'||!Array.isArray(S[k]))continue;m[k]=new Map(S[k].filter(x=>x&&typeof x==='object'&&x.id!==undefined).map(x=>[x.id,JSON.stringify(x)]));}return m;}
function stampApply(m){
  const who=meName()||'Someone',code=myCode(),at=new Date().toISOString();
  for(const k in S){if(k==='activity'||!Array.isArray(S[k]))continue;const old=m[k]||new Map();
    S[k].forEach(x=>{if(!x||typeof x!=='object'||x.id===undefined)return;const j=old.get(x.id);
      if(j===undefined)Object.assign(x,{addedBy:who,addedCode:code,addedAt:at});else if(j!==JSON.stringify(x))Object.assign(x,{editedBy:who,editedCode:code,editedAt:at});});}
}
// codes only (FIDEL knows whose code is whose): the code that added the record, then the code of the last edit if different
const codeOf=x=>{if(!x)return '';const a=x.addedCode||'',e=x.editedCode||'';return a&&e&&e!==a?a+' / '+e:(a||e);};
const stampLine=x=>codeOf(x)?`<div class="small muted">Code ${esc(codeOf(x))}</div>`:'';
function logAct(text,extra){
  S.activity=S.activity||[];
  S.activity.push({id:uid(),at:new Date().toISOString(),who:meName()||'Someone',code:myCode(),text,...(extra||{})});
  if(S.activity.length>500)S.activity=S.activity.sort((a,b)=>a.at.localeCompare(b.at)).slice(-500);
}
function itemLabel(x){return [x.category,x.what,x.name,x.person,x.customer,x.problem&&String(x.problem).slice(0,40),x.site&&siteName(x.site),x.amount!==undefined?fmt(num(x.amount)):x.cost!==undefined?fmt(num(x.cost)):''].filter(Boolean).join(' · ');}
P.activity=()=>{

const SEARCH_SRC=()=>[
  ['expenses','Cost','costs',x=>x.date,x=>x.amount],['subtech','Sub-tech day','staff',x=>x.date,x=>x.amount],['debts','Debt','debts',x=>x.date,x=>x.amount],
  ['issues','Site issue','issues',x=>x.date,()=>0],['tickets','Customer issue','tickets',x=>x.date,()=>0],['assets','Equipment','assets',x=>x.date,x=>x.cost],
  ['bankTx','Bank','bank',x=>x.date,x=>x.amount],['equityTx','Director money','directors',x=>x.date,x=>x.amount],['partnerTx','Partner money','partners',x=>x.date,x=>x.amount],
  ['employees','Employee','staff',()=>'',()=>0],['sites','Site','bills',()=>'',()=>0],['store','Material','mat',()=>'',()=>0],['matLog','Material use','mat',x=>x.date,()=>0]];
function searchRun(q){
  const words=String(q||'').toLowerCase().split(/\s+/).filter(Boolean);if(!words.length)return [];

// Line chart: several series over the same labels. series=[{name,color,values:[]}]
function lineChart(labels,series,h=190,half=false){
  if(!labels.length)return '<div class="empty">No data yet</div>';
  const vw=window.innerWidth||800,W=Math.max(280,Math.min(1100,vw-(vw>820?120:56))/(half&&vw>820?2:1),labels.length*14),padL=44,padB=26,top=12,all=series.flatMap(s=>s.values),max=Math.max(1,...all),min=Math.min(0,...all),rng=max-min||1;
  const x=i=>padL+(labels.length===1?0:i*(W-padL-10)/(labels.length-1)),y=v=>top+(max-v)/rng*(h-top-padB);
  const grid=[0,.25,.5,.75,1].map(f=>{const v=min+f*rng;return `<line x1="${padL}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${padL-6}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`;}).join('');
  const step=Math.ceil(labels.length/10);
  const xl=labels.map((l,i)=>i%step===0||i===labels.length-1?`<text x="${x(i)}" y="${h-6}" text-anchor="middle">${esc(l)}</text>`:'').join('');
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" points="${s.values.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`+s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="${s.color}"><title>${esc(s.name)} ${esc(labels[i])}: ${fmt(v)}</title></circle>`).join('')).join('');
  const zero=min<0?`<line x1="${padL}" x2="${W-6}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`:'';
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div><div class="chart"><svg viewBox="0 0 ${W} ${h}" role="img">${grid}${zero}${lines}${xl}</svg></div>`;
}
const PIE_COLORS=['#0057A6','#0d9488','#f59e0b','#7c3aed','#db2777','#16a34a','#ea580c','#0891b2','#64748b','#a16207','#4f46e5','#be123c'];
function donut(items){
  items=items.filter(i=>i.v>0).sort((a,b)=>b.v-a.v);const tot=sum(items,i=>i.v);
  if(!tot)return '<div class="empty">No costs yet</div>';
  let a=0;const R=70,r=44,cx=90,cy=90;

    const [x0,y0]=p(a0,R),[x1,y1]=p(a1-1e-6,R),[x2,y2]=p(a1-1e-6,r),[x3,y3]=p(a0,r);
    return `<path d="M${x0} ${y0}A${R} ${R} 0 ${big} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${big} 0 ${x3} ${y3}Z" fill="${PIE_COLORS[i%PIE_COLORS.length]}"><title>${esc(it.label)}: ${fmt(it.v)}</title></path>`;}).join('');
  return `<div class="donut"><svg viewBox="0 0 180 180" width="180" height="180">${arcs}<text x="90" y="86" text-anchor="middle" class="dt">${fmtK(tot)}</text><text x="90" y="104" text-anchor="middle">total</text></svg>

}

const SEASONS=[['01','03','Jan–Mar'],['04','06','Apr–Jun'],['07','09','Jul–Sep'],['10','12','Oct–Dec']];
function periodKey(d,by){
  if(by==='day')return d;
  if(by==='week'){const dt=parse(d),mon=addDays(d,-((dt.getDay()+6)%7));return mon;}
  if(by==='month')return d.slice(0,7);
  if(by==='season'){const m=d.slice(5,7),q=SEASONS.findIndex(s=>m>=s[0]&&m<=s[1]);return d.slice(0,4)+'-Q'+(q+1);}
  return d.slice(0,4);
}
function periodLabel(k,by){
  if(by==='day')return fmtD(k);
  if(by==='week')return 'Week of '+fmtDs(k);
  if(by==='month')return monthLabel(k);
  if(by==='season'){const [y,q]=k.split('-Q');return SEASONS[q-1][2]+' '+y;}
  return k;
}
function analysisData(by,from,to){
  const c=costsIn(from,to),G={};
  const get=k=>G[k]=G[k]||{e:0,c:0,days:new Set(),site:{},sc:{}};
  for(const d in S.earnings){if(d<from||d>to)continue;const r=get(periodKey(d,by));r.days.add(d);for(const id in S.earnings[d]){const v=num(S.earnings[d][id]);r.e+=v;r.site[id]=(r.site[id]||0)+v;}}
  (S.lumpIncome||[]).forEach(x=>{if(x.date<from||x.date>to)return;get(periodKey(x.date,by)).e+=num(x.amount);});
  c.forEach(x=>{const r=get(periodKey(x.date,by));r.c+=x.amount;const k=x.site&&site(x.site)?x.site:'general';r.sc[k]=(r.sc[k]||0)+x.amount;});
  return Object.keys(G).sort().map(k=>({k,label:periodLabel(k,by),...G[k],p:G[k].e-G[k].c,n:G[k].days.size}));
}

function empStats(emp,from,to){

  const onTime=ch.filter(c=>c.onTime!==undefined&&c.onTime!=='');const onTimePct=onTime.length?onTime.filter(c=>c.onTime==='Yes').length/onTime.length:null;
  const fixRate=iss.length?fixed.length/iss.length:null,avgFix=fixDays.length?sum(fixDays)/fixDays.length:null;
  const parts=[[avgRating!==null?avgRating/5:null,0.4],[doneScore,0.3],[onTimePct,0.15],[fixRate,0.15]].filter(x=>x[0]!==null);
  const score=parts.length?Math.round(sum(parts,x=>x[0]*x[1])/sum(parts,x=>x[1])*100):null;

const PENDING=[];

function moveToGroup(x){const i=S.sites.indexOf(x);if(i<0)return;S.sites.splice(i,1);let j=-1;S.sites.forEach((y,k)=>{if(y.group===x.group)j=k;});S.sites.splice(j<0?S.sites.length:j+1,0,x);}
function reconcileBills(){
  let ch=false;
  const done=S.settings.pendingDone=S.settings.pendingDone||[];
  // FIDEL, 11 Oct 2026: the store items added that day were paid for in earlier months, so their cost is taken
  // off Running Costs once (the items stay in the store). Only after the online copy is loaded, so it sticks.
  // FIDEL, 11 Oct 2026: only FIDELIS and DOROTHY are partners; MAURICE is the head technician.
  if(ONLINE&&!done.includes('nopartner-maurice')){
    S.settings.partners=(S.settings.partners||[]).filter(n=>String(n).trim().toUpperCase()!=='MAURICE');
    if(S.settings.partnerShares)delete S.settings.partnerShares.MAURICE;
    done.push('nopartner-maurice');ch=true;
  }
  if(ONLINE&&!done.includes('nocost-20261011')){
    const NAMES=['router xpon','atb','pachcode','media converter','outdoor cable','indoor cable','microtik rb 951'];
    const hit=e=>e.date==='2026-10-11'&&e.category==='Materials'&&NAMES.some(n=>new RegExp('^[\\d.]+ \\S+ '+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'$','i').test(String(e.desc||'').trim()));
    S.expenses.filter(hit).forEach(e=>{S.expenses.splice(S.expenses.indexOf(e),1);logAct('Took off a cost already paid in earlier months: '+e.desc+' ('+fmt(num(e.amount))+')',{key:'expenses',item:e});});
    done.push('nocost-20261011');ch=true;
  }
  // FIDEL, 12 Oct 2026: 17 routers were used at Kibos today; take them out of the store once.
  // FIDEL, 14 Oct 2026: Genzi F8 belongs to the Genzi group (it was added under Dala).
  if(ONLINE&&!done.includes('f8-genzi')){
    S.sites.filter(x=>/genzi\s*f\s*8\b|^f\s*8$/i.test(String(x.name).trim())&&x.group!=='Genzi').forEach(x=>{x.group='Genzi';moveToGroup(x);logAct('Moved '+x.name+' to the Genzi group');});
    done.push('f8-genzi');ch=true;
  }
  if(ONLINE&&!done.includes('kibos-routers-20261012')){
    const R=S.store.filter(m=>/router/i.test(m.name)),site=(S.sites.find(x=>/kibos/i.test(x.name))||{}).id||'general';
    const already=S.matLog.some(l=>l.type==='Out'&&l.date==='2026-10-12'&&num(l.qty)===17&&/router/i.test(l.name));
    if(already){}
    else if(R.length===1){const m=R[0];m.qty=num(m.qty)-17;S.matLog.push({id:uid(),date:'2026-10-12',name:m.name,qty:17,type:'Out',site,note:'Used at Kibos'});logAct('Took 17 '+m.name+' out of the store: used at Kibos on 12 Oct');toast('17 '+m.name+' taken out of the store for Kibos. '+num(m.qty)+' left.');}
    else{logAct('Could not take out the 17 Kibos routers: '+(R.length?'more than one router item in the store':'no router item in the store'));setTimeout(()=>toast('Please take out the 17 Kibos routers yourself: Materials → − Use on the router row.'),1500);}
    done.push('kibos-routers-20261012');ch=true;
  }
  for(const x of PENDING){
    if(done.includes(x.id))continue;
    if(!S.expenses.some(e=>e.id===x.id||(e.site===x.site&&e.category===x.category&&num(e.amount)===num(x.amount)&&String(e.date).slice(0,7)===x.date.slice(0,7))))S.expenses.push({...x});
    done.push(x.id);ch=true;
  }
  for(const s of S.sites){
    for(const [dk,ak,cat,tag] of [['tokenLastPaid','tokenLastAmount','Electricity tokens','tok'],['wifiLastPaid','wifiAmount','Wifi subscription','wifi']]){
      const d=s[dk],a=num(s[ak]),mk=tag+'Counted';
      if(!d||!a||s[mk]===d)continue;
      if(!S.expenses.some(e=>e.site===s.id&&e.category===cat&&e.date===d)){
        S.expenses.push({id:`auto-${tag}-${s.id}-${d}`,date:d,category:cat,site:s.id,amount:a,desc:(tag==='tok'?(s.tokenMeter?'Meter '+s.tokenMeter:'Token'):(s.wifiAccount?'Acc '+s.wifiAccount:'WiFi'))+' (from site details)',paidBy:BIZ});
      }
      s[mk]=d;ch=true;
    }
  }
  return ch;
}

  addReport(){openForm('Write a report',reportFields(),{},o=>{
    const mats=[],spent=[];

  async saveDay(){
    const d=UI.earnDate||today(),rec={};
    if(!lockOk(d))return;
    document.querySelectorAll('.earnIn').forEach(i=>{if(i.value.trim()!=='')rec[i.dataset.site]=num(i.value);});
    const odd=S.sites.filter(x=>rec[x.id]!==undefined&&earnOdd(rec[x.id],usualEarn(x.id,d)));
    if(odd.length&&!await ask(`These look unusual: ${odd.map(x=>x.name+' '+fmt(rec[x.id])+' (usual '+fmt(usualEarn(x.id,d))+')').join(', ')}. Save anyway?`,'Save anyway'))return;
    if(Object.keys(rec).length)S.earnings[d]=rec;else delete S.earnings[d];
    save();UI.earnMonth=d.slice(0,7);render();toast(`Saved ${fmtDs(d)}: ${fmt(sum(Object.values(rec)))} · ${profitNote()}`);
  },

  async upImport(){
    const ok=(UI.upload||[]).filter(u=>u.site&&Object.keys(u.rows).length);
    if(!ok.length){toast('Nothing to save. Pick the site for each file first.');return;}
    if((UI.upload||[]).some(u=>!u.site&&Object.keys(u.rows).length)&&!await ask('Some files have no site chosen and will be skipped. Continue?','Continue'))return;
    let n=0,last='';
    ok.forEach(u=>{for(const d in u.rows){(S.earnings[d]=S.earnings[d]||{})[u.site]=u.rows[d];n++;if(d>last)last=d;}});
    save();UI.upload=[];UI.earnMonth=last.slice(0,7);render();toast(`Saved ${n} figures from ${ok.length} site${ok.length>1?'s':''}`);
  },

async function download(name,text,type){

    if(dl){try{await dl.save({filename:name,data:text});return true;}catch(e){toast(e&&e.code==='declined'?'Download cancelled':'Could not download the file here');return false;}}}catch(e){}
  return downloadLink(name,text,type);
}
/* ---------- Excel export: a real .xlsx built here (stored zip, no library needed) ---------- */
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){ // files: [[name, string]]
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  const u16=v=>[v&255,(v>>>8)&255],u32=v=>[v&255,(v>>>8)&255,(v>>>16)&255,(v>>>24)&255];
  for(const [name,text] of files){const nb=enc.encode(name),db=enc.encode(text),c=crc32(db);
    const loc=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0)]);
    parts.push(loc,nb,db);
    cen.push(new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(c),...u32(db.length),...u32(db.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nb);
    off+=loc.length+nb.length+db.length;}
  const csize=cen.reduce((a,b)=>a+b.length,0);
  const end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(off),...u16(0)]);
  return new Blob([...parts,...cen,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function xlsx(sheets){ // sheets: [[name, rows[][]]]
  const x=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
  const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
  const sheet=rows=>`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r,ri)=>`<row r="${ri+1}">${r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v===null||v===undefined||v==='')return '';if(typeof v==='number'&&isFinite(v))return `<c r="${ref}"><v>${v}</v></c>`;return `<c r="${ref}" t="inlineStr"${ri===0?' s="1"':''}><is><t xml:space="preserve">${x(v)}</t></is></c>`;}).join('')}</row>`).join('')}</sheetData></worksheet>`;
  const names=sheets.map(s=>s[0].replace(/[\\/?*\[\]:]/g,' ').slice(0,31));
  const files=[['[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${names.map((n,i)=>`<sheet name="${x(n)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((_,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map((s,i)=>[`xl/worksheets/sheet${i+1}.xml`,sheet(s[1])])];
  return zipStore(files);
}

  repMonth(el){UI.repMonth=el.value;render();},
  tFilter(el){UI.tFilter=el.value;render();},
  bankRange(el){UI.bankRange=el.value;render();},
  teamRange(el){UI.teamRange=el.value;render();},
  partners(el){const l=el.value.split(',').map(x=>x.trim()).filter(Boolean);if(l.length){S.settings.partners=l;save();toast('Saved');}},
  staffMonth(el){UI.staffMonth=el.value;render();},
  crewMonth(el){UI.crewMonth=el.value;render();},
  plMonth(el){UI.plMonth=el.value;render();},
  issueFilter(el){UI.issueFilter=el.value;render();},
  tgtMonth(el){UI.tgtMonth=el.value;render();},
  assetSite(el){UI.assetSite=el.value;render();},
  debtFilter(el){UI.debtFilter=el.value;render();},
  setting(el){const k=el.dataset.k;S.settings[k]=el.type==='number'?num(el.value):el.value;save();if(k==='business')renderHead();toast('Saved');},
  siteName(el){const s=site(el.dataset.k);if(el.value.trim()){s.name=el.value.trim();save();toast('Saved');}}
};

/* ---------- wiring ---------- */
document.addEventListener('click',e=>{
  const go=e.target.closest('[data-go]');
  if(go){e.preventDefault();goto(go.dataset.go);return;}
  const a=e.target.closest('[data-act]');
  if(a&&ACT[a.dataset.act]){e.preventDefault();ACT[a.dataset.act](a.dataset.id,a);}
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-chg]');if(el&&CHG[el.dataset.chg])CHG[el.dataset.chg](el);});
document.addEventListener('input',e=>{if(e.target.classList.contains('earnIn')){{const w=$('#ew_'+e.target.dataset.site);if(w)w.textContent=earnOdd(num(e.target.value),num(w.dataset.usual))?' '+earnOdd(num(e.target.value),num(w.dataset.usual)):'';}let t=0;document.querySelectorAll('.earnIn').forEach(i=>t+=num(i.value));$('#earnTot').textContent=fmt(t);$('#earnProfit').innerHTML=dayProfitTxt(t,num($('#earnTot').dataset.cost));}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('earnIn')){e.preventDefault();const all=[...document.querySelectorAll('.earnIn')],i=all.indexOf(e.target);if(i<all.length-1)all[i+1].focus();else ACT.saveDay();}});
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.sites||!o.earnings)throw 0;
    ask('Add everything in this backup to the data already here? Nothing already here is deleted. Where both have the same day or entry, the backup\'s figure is used.','Restore').then(y=>{if(!y)return;S=mergeState(S,migrate(o));save();render();toast('Backup restored and combined with your data');});}catch(err){toast('That file is not a valid backup.');}
    e.target.value='';};
  r.readAsText(f);
});
$('#upFile').addEventListener('change',e=>{if(e.target.files.length)readFiles(e.target.files).then(()=>e.target.value='');});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropZone');if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files.length)readFiles(e.dataTransfer.files);}});
window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(PAGES.some(x=>x[0]===p)&&p!==UI.page){UI.page=p;render();}});
function goto(p){UI.page=p;if(location.hash!=='#'+p){try{history.pushState(null,'','#'+p);}catch(e){}}render();scrollTo(0,0);}
function renderHead(){
  $('#bizName').textContent=S.settings.business||'Dala & Genzi WiFi';
  {const m=$('#meName');if(m)m.textContent=meName()?'You: '+meName()+(myCode()?' · '+myCode():''):'Who are you?';}
  document.title=(S.settings.business||'Dala & Genzi WiFi')+' Manager';
  if(!navGroups().some(g=>g[1].includes(UI.page)))UI.page=navGroups()[0][1][0];
  $('#fab').style.display=isTech()?'none':'';document.querySelectorAll('.hbtn').forEach(b=>b.style.display=isTech()?'none':'');
  const g=groupOf(UI.page);UI.lastSub=UI.lastSub||{};UI.lastSub[g[0]]=UI.page;
  $('#nav').innerHTML=navGroups().map(([n,pg])=>`<button data-go="${UI.lastSub[n]||pg[0]}" class="${n===g[0]?'on':''}">${esc(n)}</button>`).join('');
  $('#subnav').innerHTML=g[1].length>1?`<div class="subnav-in">${g[1].map(k=>`<button data-go="${k}" class="${k===UI.page?'on':''}">${esc(SUBNAME[k]||k)}</button>`).join('')}</div>`:'';
  $('#subnav').hidden=g[1].length<2;
  const on=$('#nav .on');if(on)on.scrollIntoView({block:'nearest',inline:'nearest'});
}
function render(){renderHead();$('#main').innerHTML=P[UI.page]();}
window.addEventListener('popstate',()=>{const p=location.hash.slice(1)||'dash';if(PAGES.some(x=>x[0]===p)){UI.page=p;render();}});
if(reconcileBills()){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
render();
connectOnline();
// keep a copy of the page so it opens on slow or no internet (only on the real website)
if(API_URL==='/api'&&'serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
$('#dlg').addEventListener('close',()=>{if(needApply)setTimeout(applyRemote,0);});
document.addEventListener('focusout',()=>{if(needApply)setTimeout(applyRemote,300);});
</script>
<script>/* auto-update */(function(){const V='1791965229';function chk(){fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/const V='(\d+)'/);if(m&&Number(m[1])>Number(V)&&!(document.getElementById('dlg')||{}).open){location.replace(location.pathname+'?v='+m[1]+location.hash);}}).catch(()=>{});}chk();setInterval(chk,300000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk();});})();</script>
